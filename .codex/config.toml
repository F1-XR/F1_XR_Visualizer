[mcp_servers.unity]
enabled = false
command = "powershell.exe"
args = [
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    ".codex\\unity-mcp.ps1",
]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.unity.tools.Unity_RunCommand]
approval_mode = "approve"

[mcp_servers.unity.tools.Unity_GetConsoleLogs]
approval_mode = "approve"

